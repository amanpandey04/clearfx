  </g>
  <text x="294" y="174" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="150" font-weight="800" letter-spacing="-8" fill="#15243A">clear<tspan fill="#76A83C">fx</tspan></text>
  <text x="302" y="222" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="23" font-weight="600" letter-spacing="3.8" fill="#738198">CURRENCY DATA, MADE CLEAR</text>
</svg>