<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="260" viewBox="0 0 1120 260" role="img" aria-labelledby="title desc">
  <title id="title">ClearFX logo</title>
  <desc id="desc">ClearFX wordmark with a currency-exchange arrow icon.</desc>
  <defs>
    <linearGradient id="arrow" x1="54" y1="48" x2="190" y2="205" gradientUnits="userSpaceOnUse">
      <stop stop-color="#D5FF9B"/>
      <stop offset="1" stop-color="#A7E65E"/>
    </linearGradient>
    <linearGradient id="iconbg" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1D3048"/>
      <stop offset="1" stop-color="#0E1829"/>
    </linearGradient>
  </defs>
  <g transform="translate(8 10)">
    <rect width="240" height="240" rx="55" fill="url(#iconbg)"/>
    <rect x="5" y="5" width="230" height="230" rx="50" fill="none" stroke="#AFC3DF" stroke-opacity=".13" stroke-width="2"/>
    <g fill="none" stroke="url(#arrow)" stroke-linecap="round" stroke-linejoin="round" stroke-width="15">
      <path d="M49 86h142m0 0-28-28m28 28-28 28"/>
      <path d="M191 154H49m0 0 28-28m-28 28 28 28"/>
